<section class="page-title"><div class="eyebrow" style="color:var(--blue)">Public registration</div><h1>Create an account</h1><p class="muted">Register as a voter, political party or candidate.</p></section>

<section class="panel"><form id="register-form"><div class="form-grid">
<div class="field"><label for="role">Account type</label><select id="role" required><option value="">Select role</option><option value="Voter">Voter</option><option value="Party">Party</option><option value="Candidate">Candidate</option></select></div>
<div class="field"><label for="fullName">Full name / Registered name</label><input id="fullName" required maxlength="100"></div>
<div class="field"><label for="username">Username</label><input id="username" required minlength="4" maxlength="40" pattern="[A-Za-z0-9_]+" autocomplete="username"></div>
<div class="field"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="new-password"><span class="help">At least 8 characters.</span></div>
<div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></div>
<div class="field full"><label class="help"><input type="checkbox" id="terms" required style="width:auto"> I confirm that the information provided is accurate.</label></div></div>
<div class="form-actions"><button class="btn" type="submit">Create account</button><a class="btn btn-secondary" href="login.html">Back to login</a></div></form></section>
</main><footer class="site-footer"><div class="footer-inner"><span>© <span data-current-year></span> Electra · Academic DBMS project</span><span>Demonstration interface — not an official election service.</span></div></footer><div class="toast" role="status" aria-live="polite"></div></body></html>
